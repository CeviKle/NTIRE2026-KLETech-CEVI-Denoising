name: denoising_test_150000
model_type: SwinIRModel
scale: 1
num_gpu: 0

path:
  pretrain_network_g: experiments/swinir_denoising_ntire/models/12_swinir.pth
  strict_load_g: true

datasets:
  test:
    name: test
    type: SingleImageDataset
    dataroot_lq: /NTIRE2026/C7_Denoising/LSDIR_DIV2K_Test_Sigma50

name: swinir_denoising_ntire
model_type: SwinIRModel
scale: 1
num_gpu: 1

# -------------------- PATH --------------------
path:
  root: .
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# -------------------- DATASETS --------------------
datasets:
  train:
    name: train
    type: PairedImageDataset
    dataroot_gt: /NTIRE2026/C7_Denoising/train_gt
    dataroot_lq: /NTIRE2026/C7_Denoising/train_inp
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    batch_size_per_gpu: 4
    num_worker_per_gpu: 4

  val:
    name: val
    type: SingleImageDataset
    dataroot_lq: /NTIRE2026/C7_Denoising/noise/noise
    io_backend:
      type: disk

# -------------------- NETWORK --------------------
network_g:
  type: SwinIR
  img_size: 128
  window_size: 8
  embed_dim: 96
  depths: [6,6,6,6]
  num_heads: [6,6,6,6]
  mlp_ratio: 4
  upscale: 1
  img_range: 1.
  resi_connection: 1conv

# -------------------- TRAINING --------------------
train:
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0.0001

  scheduler:
    type: MultiStepLR
    milestones: [100000, 150000]
    gamma: 0.5

  total_iter: 100000
  warmup_iter: -1
  val_freq: 5000

  # 🔥 ADD THIS LOSS
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# -------------------- LOGGING --------------------
logger:
  print_freq: 1
  save_checkpoint_freq: 5000
  use_tb_logger: false

# -------------------- DIST --------------------

dist: false
auto_resume: true

